[package]
name = "anvesa-syntax"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Tree-Sitter AST parsing and outline extraction for Anvesa"

[dependencies]
# Grammar versions match the wasm builds the TypeScript side parses with, so a native outline
# and a web-tree-sitter one are built from the same syntax trees.
tree-sitter = "0.25"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.0"
tree-sitter-go = "=0.25.0"
tree-sitter-css = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.1"
tree-sitter-cpp = "=0.23.4"
tree-sitter-ruby = "=0.23.1"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-php = "=0.24.2"
sha2 = "0.10"
rayon = "1.10"
serde = { workspace = true }
serde_json = { workspace = true }
