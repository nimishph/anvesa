name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    # One job per platform, because the program is built natively on each and tested by running it.
    # The platforms are listed in tooling/platforms.ts.
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: win32-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Build the program for this platform
        run: bun run package
      - name: Run the program, and the command a user's package manager would link
        run: bun run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: medha-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/npm/
          if-no-files-found: error
