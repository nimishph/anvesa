name: Release

# Push a tag `vX.Y.Z` that matches the version in cli/package.json. Each platform builds and tests
# its program; then the platform packages are published, then @cntxt-labs/code-lens, which depends on
# them, and the archives are attached to a GitHub release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: win32-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package
      - run: bun run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: code-lens-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/npm/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: The tag is the version
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match cli/package.json version ${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: staged
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: code-lens-*
          path: archives
          merge-multiple: true
      - name: Platform packages, then the command that depends on them
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The token is stage-only, so every publish uses the `stage` dist-tag instead of the
        # default `latest`; installs must opt in with `@stage` until a `latest`-capable token
        # promotes a release.
        run: |
          for folder in staged/*/; do
            npm publish "$folder" --access public --provenance --tag stage
          done
          cp README.md LICENSE cli/
          npm publish ./cli --access public --provenance --tag stage
      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*
