name: Release

# Trigger on version tags (e.g. v0.1.0)
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: win32-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package
      - run: bun run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: anvesa-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/npm/
          if-no-files-found: error

  benchmark:
    # What a release must not get worse at: the golden queries answer exactly as written for every
    # language, and the stress benchmark, run on this release's own build, does not regress against
    # the previous release's numbers. A failure here stops the release from being published.
    name: Golden queries and stress benchmark
    needs: build
    runs-on: ubuntu-latest
    env:
      ANVESA_STRESS_HOME: ${{ github.workspace }}/.stress
      ANVESA_GOLDEN_REQUIRE: all
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run package

      - name: Install the grammars every golden suite and benchmark repository needs
        run: |
          program="$(ls dist/anvesa-*-linux-x64/anvesa)"
          for suite in eval/golden/*/; do
            language="$(basename "$suite")"
            state="$("$program" grammar list --json | node -e               'const g = JSON.parse(require("fs").readFileSync(0, "utf8")).find((x) => x.language === process.argv[1]); console.log(g ? g.state : "unknown")'               "$language")"
            if [ "$state" != "ready" ]; then
              "$program" grammar install "$language" --user --download
            fi
          done

      - name: Golden queries, every language
        run: bun run golden --json golden-report.json

      - name: Restore the previous release's benchmark history
        run: |
          mkdir -p "$ANVESA_STRESS_HOME"
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'stress-history.tar.gz' --dir . ; then
            tar -xzf stress-history.tar.gz -C "$ANVESA_STRESS_HOME"
          else
            echo "::notice::no earlier stress history was found: this run is the baseline"
          fi

      - name: Stress benchmark, compared with the previous release
        run: |
          set -o pipefail
          grep -v '^[[:space:]]*\(#\|$\)' tooling/stress/release-repos.txt | while read -r line; do
            bun run stress add --if-missing $line
          done
          bun run stress setup --download
          bun run stress run --no-dense --fail-on-regression | tee stress-report.txt

      - name: Keep the history for the next release
        if: always()
        run: tar -czf stress-history.tar.gz -C "$ANVESA_STRESS_HOME" manifest.json runs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            golden-report.json
            stress-report.txt
            stress-history.tar.gz
          if-no-files-found: warn

  release:
    name: Create Release & Changelog
    needs: [build, benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify Tag Matches Manifest Version
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match cli/package.json version ${version}" >&2
            exit 1
          fi

      # git-cliff --latest lists what changed since the previous tag it can reach. A previous tag
      # that is not in this tag's history (history rewritten after tagging) makes it list every
      # commit ever made, so say so instead of publishing notes that look right and are not.
      - name: Check the previous release is in this one's history
        run: |
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -n 1)"
          if [ -n "${previous}" ] && ! git merge-base --is-ancestor "${previous}" "${GITHUB_REF_NAME}"; then
            echo "::warning::${previous} is not an ancestor of ${GITHUB_REF_NAME}: the release notes will list the whole history. Re-tag ${previous} on the commit that was released."
          fi

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: staged
          merge-multiple: true

      # `actions/upload-artifact` stores files in a zip and does not carry POSIX permission bits
      # across the job boundary, so every program in `staged/` arrives 0644 whatever the build job
      # set. Published as-is, `anvesa` fails with EACCES on macOS and Linux. Put the bit back, and
      # check it stuck. The release archives do not need this: they are tarballs made in the build
      # job, so their entries keep the mode. The launcher also sets the bit on EACCES, as a fallback.
      - name: Restore the executable bit
        run: |
          set -euo pipefail
          for dir in staged/*/; do
            mapfile -t programs < <(find "$dir/bin" -maxdepth 1 -type f)
            if [ "${#programs[@]}" -ne 1 ]; then
              echo "expected exactly one program in $dir/bin, found ${#programs[@]}" >&2
              exit 1
            fi
            program="${programs[0]}"
            chmod 0755 "$program"
            mode="$(stat -c '%a' "$program")"
            printf '%s  %s\n' "$mode" "$program"
            [ "$mode" = "755" ] || { echo "mode is $mode, expected 755" >&2; exit 1; }
          done

      - uses: actions/download-artifact@v4
        with:
          pattern: anvesa-*
          path: archives
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: benchmark
          path: benchmark

      - name: Checksums for the archives
        working-directory: archives
        run: sha256sum *.zip *.tar.gz > SHA256SUMS && cat SHA256SUMS

      # Platform packages go first so the launcher never points at a version that is not there yet.
      # A version that is already on the registry is skipped (so a re-run is safe); any other
      # failure stops the release. `npm stage publish` (npm 11+, hence node-version 24 above) defers
      # 2FA to the approval step you run yourself, so CI needs only an ordinary automation token
      # here, not a bypass-2FA one. Staged with dist-tag latest: approving a package makes it live.
      # The Promote workflow can still move latest by hand (to roll back, for one).
      - name: Stage on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set: refusing to release without staging on npm" >&2
            exit 1
          fi
          stage() {
            # npm treats a bare "owner/repo"-shaped path as GitHub shorthand, not a local folder,
            # unless it starts with "./", so this normalizes to that regardless of what $1 arrives as.
            dir="./${1#./}"
            name="$(node -p "require('${dir}/package.json').name")"
            version="$(node -p "require('${dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published, skipping"
            else
              npm stage publish "${dir}" --access public --provenance --tag latest
            fi
          }
          for folder in staged/*/; do stage "${folder%/}"; done
          cp README.md LICENSE cli/
          stage ./cli

      - name: List what needs approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::notice::Each package above is staged, not live yet. Run 'npm stage approve <id>' (with your own 2FA) for each, or 'npm stage list' to see them again later."
          npm stage list "@cntxt-labs/anvesa" || true
          npm stage list "@cntxt-labs/anvesa-linux-x64" || true
          npm stage list "@cntxt-labs/anvesa-linux-arm64" || true
          npm stage list "@cntxt-labs/anvesa-darwin-arm64" || true
          npm stage list "@cntxt-labs/anvesa-win32-x64" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: anvesa ${{ github.ref_name }}
          body_path: RELEASE_CHANGELOG.md
          generate_release_notes: true
          files: |
            archives/*.zip
            archives/*.tar.gz
            archives/SHA256SUMS
            benchmark/stress-history.tar.gz
            benchmark/stress-report.txt
            benchmark/golden-report.json
