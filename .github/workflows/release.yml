name: Release

# Trigger on version tags (e.g. v0.1.0)
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: win32-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package
      - run: bun run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: anvesa-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/npm/
          if-no-files-found: error

  release:
    name: Create Release & Changelog
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify Tag Matches Manifest Version
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match cli/package.json version ${version}" >&2
            exit 1
          fi

      - name: Generate Changelog
        uses: git-cliff-org/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: staged
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: anvesa-*
          path: archives
          merge-multiple: true

      - name: Publish to npm (if NPM_TOKEN is provided)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for folder in staged/*/; do
            npm publish "$folder" --access public --provenance --tag latest || true
          done
          cp README.md LICENSE cli/
          npm publish ./cli --access public --provenance --tag latest || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: anvesa ${{ github.ref_name }}
          body_path: RELEASE_CHANGELOG.md
          generate_release_notes: true
          files: |
            archives/*.zip
            archives/*.tar.gz
